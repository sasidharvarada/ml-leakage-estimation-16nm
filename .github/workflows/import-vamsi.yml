name: Import Vamsi project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-vamsi branch
        uses: actions/checkout@v4
        with:
          ref: dev-vamsi
          fetch-depth: 0

      - name: Clone complete Vamsi repository
        run: |
          git clone --depth 1 \
            https://github.com/321106512011-crypto/ml-leakage-estimation-16nm.git \
            /tmp/vamsi-project

      - name: Copy project into dev-vamsi
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/vamsi-project/ ./

      - name: Commit and push to dev-vamsi
        run: |
          git config user.name "321106512011-crypto"
          git config user.email "321106512011-crypto@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import complete Vamsi leakage estimation project"
            git push origin HEAD:dev-vamsi
          fi
